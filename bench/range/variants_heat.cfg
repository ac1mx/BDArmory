// Range test variants of the AIM-9X (run_range.ps1 -PatchFile, -Missiles "AIM9X,AIM9X-S,AIM9X-SA" -RepeatGeometry 6 -StraightFraction 0.5):
// the stock part, the smart seeker on the same guidance, and the smart seeker on augmented proportional navigation.
+PART[AIM9X]:FINAL
{
	@name = AIM9X-S
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%flareRejection = 1.25
		%trackGate = 2
		%resolveRange = 1500
	}
}
+PART[AIM9X]:FINAL
{
	@name = AIM9X-SA
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%flareRejection = 1.25
		%trackGate = 2
		%resolveRange = 1500
		%homingType = augpronav
		%pronavGain = 4
	}
}
