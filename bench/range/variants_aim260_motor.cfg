// AIM-260 motor test: the fitted motor (131 kN for 3.6 s: ~2900 m/s of boost, 2000 m/s low down) against one with half the boost
// and a long sustain (MissileBench: same no-escape reach, 32.6 km at 9 km), at low-altitude, off-boresight launches where three
// fight shots dived into the sea. run_range.ps1 -PatchFile, -Missiles AIM-260,AIM-260-Q,AIM-120D -RepeatGeometry 3
// -RangeOptions "minRange=15000;maxRange=32000;minAltitude=2000;maxAltitude=4500;hobsFraction=0.5"
+PART[AIM-260]:FINAL
{
	@name = AIM-260-Q
	@MODULE[MissileLauncher]
	{
		%thrust = 60
		%boostTime = 3.5
		%cruiseThrust = 42
		%cruiseTime = 20
	}
}
