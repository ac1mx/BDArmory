// Range test variants for long shots with the other radar missiles on the save's craft: each as it is, and a copy that lofts shots
// beyond 16 km the way the AIM-120D does (bench/fight/smart_seekers.cfg; range run loft1).
// run_range.ps1 -PatchFile, -Missiles "RVV-AE-PD,RVV-AE-PD-L,METEOR,METEOR-L,AA13R37Arrow,AA13R37Arrow-L,bahaAim120,bahaAim120-L"
//  -RepeatGeometry 8 -RangeOptions "minRange=14000;maxRange=30000;minAltitude=2500;maxAltitude=5000;minSpeed=250;maxSpeed=750"
+PART[RVV-AE-PD]:FINAL
{
	@name = RVV-AE-PD-L
	@MODULE[MissileLauncher]
	{
		%homingType = aamloft
		%LoftMaxAltitude = 14000
		%LoftAngle = 30
		%LoftTermAngle = 15
		%LoftRangeFac = 0.4
		%LoftAltitudeAdvMax = -100000
		%LoftRangeOverride = 16000
		%terminalHomingRange = 5000
	}
}
