// Range test variants for the KSPCustom long-range missiles (AIM-174B, AIM-424, AIM-260): as configured (steep loft), a shallow
// loft, and no loft. run_range.ps1 -PatchFile, -Missiles AIM-174B,AIM-174B-L2,AIM-174B-N,AIM-424,AIM-424-L2,AIM-424-N,AIM-260,AIM-260-L2,AIM-260-N
// -RepeatGeometry 9 -RangeOptions "minRange=25000;maxRange=60000;minAltitude=3000;maxAltitude=10000"
+PART[AIM-174B]:FINAL
{
	@name = AIM-174B-L2
	@MODULE[MissileLauncher]
	{
		%LoftMaxAltitude = 15000
		%LoftAngle = 25
		%LoftTermAngle = 12
		%LoftRangeFac = 0.3
		%terminalHomingRange = 10000
	}
}
+PART[AIM-174B]:FINAL
{
	@name = AIM-174B-N
	@MODULE[MissileLauncher]
	{
		%homingType = aam
	}
}
+PART[AIM-424]:FINAL
{
	@name = AIM-424-L2
	@MODULE[MissileLauncher]
	{
		%LoftMaxAltitude = 15000
		%LoftAngle = 25
		%LoftTermAngle = 12
		%LoftRangeFac = 0.3
		%terminalHomingRange = 10000
	}
}
+PART[AIM-424]:FINAL
{
	@name = AIM-424-N
	@MODULE[MissileLauncher]
	{
		%homingType = aam
	}
}
+PART[AIM-260]:FINAL
{
	@name = AIM-260-L2
	@MODULE[MissileLauncher]
	{
		%LoftMaxAltitude = 10000
		%LoftAngle = 20
		%LoftTermAngle = 10
		%LoftRangeFac = 0.25
		%terminalHomingRange = 6000
	}
}
+PART[AIM-260]:FINAL
{
	@name = AIM-260-N
	@MODULE[MissileLauncher]
	{
		%homingType = aam
	}
}
