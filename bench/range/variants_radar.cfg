// Range test variants of the AIM-120D (run_range.ps1 -PatchFile, -Missiles "AIM-120D,AIM-120D-S,AIM-120D-SA" -RepeatGeometry 6 -StraightFraction 0.5):
// the stock part, the smart seeker on the same guidance, and the smart seeker on augmented proportional navigation. Six trials per
// geometry fly each variant twice, so the report can also say how often the same shot ends the same way.
+PART[AIM-120D]:FINAL
{
	@name = AIM-120D-S
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%datalink = true
	}
}
+PART[AIM-120D]:FINAL
{
	@name = AIM-120D-SA
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%datalink = true
		%homingType = augpronav
		%pronavGain = 4
	}
}
