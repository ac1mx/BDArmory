// Range test variants of the AIM-120D for long shots at fast targets from medium altitude
// (run_range.ps1 -PatchFile, -Missiles "AIM-120D-S,AIM-120D-L,AIM-120D-L2" -RepeatGeometry 6
//  -RangeOptions "minRange=14000;maxRange=30000;minAltitude=2500;maxAltitude=5000;minSpeed=250;maxSpeed=750"):
// the smart seeker flying straight at the lead point, and two lofted flights (steep and shallow) that climb into thinner air and
// come down on the target.
+PART[AIM-120D]:FINAL
{
	@name = AIM-120D-S
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%datalink = true
	}
}
+PART[AIM-120D]:FINAL
{
	@name = AIM-120D-L
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%datalink = true
		%homingType = aamloft
		%LoftMaxAltitude = 14000
		%LoftAngle = 30
		%LoftTermAngle = 15
		%LoftRangeFac = 0.4
		%terminalHomingRange = 5000
	}
}
+PART[AIM-120D]:FINAL
{
	@name = AIM-120D-L2
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%datalink = true
		%homingType = aamloft
		%LoftMaxAltitude = 10000
		%LoftAngle = 20
		%LoftTermAngle = 10
		%LoftRangeFac = 0.25
		%terminalHomingRange = 5000
	}
}
