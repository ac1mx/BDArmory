// Dawn Sweep: two F-22As sweep east into a Su-35S CAP supported by a long-wave AWACS, with their own AWACS behind them and an
// F-15 missile truck hunting the enemy AWACS (Testing/Scenario.cs; run with run_scenario.ps1).
// Kerbin equator over the eastern sea; 1° of longitude is 10.5 km.
SCENARIO
{
	name = Dawn Sweep
	centre = 0.0, -57.5
	preRange = 400              // km: Darkstar's orbit to Gadfly's scramble point is about 330 km
	sunElevation = 8            // just after sunrise: the sun low in the east, behind the Su-35s
	duration = 1200
	infiniteOrdnance = false    // the default: the F-22s' stowed AIM-260 reloads run out (the player's own setting is restored after)

	FLIGHT
	{
		callsign = Viper
		team = Blue
		description = 2x F-22A, AIM-260 JATM, radars silent, LPI
		station = 0.0, -69.0
		axis = 90
		leg = 40000
		altitude = 8000
		cruiseSpeed = 340
		commitSpeed = 450
		commitRange = 150000
		radarOnRange = 110000
		emissionControl = true
		passiveRanging = true
		rangingSpread = 14000
		lpiRadar = 0.3
		home = 0.0, -77.0
		MEMBER
		{
			craft = Scenario/F-22A Viper 1.craft
		}
		MEMBER
		{
			craft = Scenario/F-22A Viper 2.craft
			slotRight = 4000
			slotBack = 1000
			slotUp = 300
		}
	}

	FLIGHT
	{
		callsign = Hammer
		team = Blue
