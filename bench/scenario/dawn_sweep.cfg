	}
	EVENT
	{
		on = surveillanceTrack:Darkstar
		message = DARKSTAR: picture east, bandits on COBRA's CAP.
	}
	EVENT
	{
		on = surveillanceTrack:Mainstay
		message = MAINSTAY: new track in the west, vectoring COBRA.
	}
	EVENT
	{
		on = firstShot
		spawn = Gadfly
		message = Shots fired. GADFLY (2x Su-35S) scrambled from the alert pad.
