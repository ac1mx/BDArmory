// Smart seekers on the air-to-air missiles carried by the save's craft (needs the BDArmory build from the missile-seekers branch;
// tested copy: BDArmory-missiles/bench/fight/smart_seekers.cfg).
// Radar: velocityGate (m/s) is how far off the beam a craft can be and still have its chaff compete; datalink lets the launching
// radar put a decoyed missile back on the craft while it holds its lock; inside resolveRange (m) the seeker ignores chaff.
// The AIM-120D also lofts shots beyond 16 km: it climbs into thinner air and comes down on the target (range run loft1, fight seek2).
@PART[AIM-120D]:FINAL
{
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%velocityGate = 50
		%datalink = true
		%resolveRange = 1500
		%homingType = aamloft
		%LoftMaxAltitude = 14000
		%LoftAngle = 30
		%LoftTermAngle = 15
		%LoftRangeFac = 0.4
		%LoftAltitudeAdvMax = -100000
		%LoftRangeOverride = 16000
		%terminalHomingRange = 5000
	}
}
