// Smart seekers on the air-to-air missiles carried by the save's craft (run_fight.ps1 -PatchFile; with -SmartCraft the fight decides
// per launching craft which missiles use them, whatever smartSeeker says here).
// Radar: velocityGate (m/s) is how far off the beam a craft can be and still have its chaff compete; datalink lets the launching
// radar put a decoyed missile back on the craft while it holds its lock; inside resolveRange (m) the seeker ignores chaff.
// The AIM-120D also lofts shots beyond 16 km: it climbs into thinner air and comes down on the target (range run loft1, fight seek2).
// Flight: guidanceLaw is the homing law once on the target (optimal: allows for the target's turn and the missile's own lag; game:
// assumes the target turns its worst; sliding: needs no measurement of the turn). motorMode pulse holds the second motor stage to
// burn out at the intercept, throttle spreads a ramjet's fuel over the flight (same total impulse either way). energyMidcourse turns
// gently far out. inertialMidcourse flies on to where the target was heading when the guiding lock is lost and searches there.
// homeOnJam follows a noise jammer it can't range (silent, chaff-proof, but a plainer flight). salvoCoordination brings a second
// missile at one craft in on another bearing. Offline comparison: bench/MissileBench laws. In fights (adv1, adv2) the optimal law
// did worse than the missiles' own guidance on the AIM-120D and Meteor (it leans on the measured target turn, which is noisy), the
// game law the same or better on the RVV-AE-PD and R-37: the radar missiles fly the game law, the heat seekers their own guidance.
@PART[AIM-120D]:FINAL
{
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%guidanceLaw = game
		%inertialMidcourse = true
		%homeOnJam = true
		%salvoCoordination = true
		%velocityGate = 50
		%datalink = true
		%resolveRange = 1500
		%homingType = aamloft
		%LoftMaxAltitude = 14000
		%LoftAngle = 30
		%LoftTermAngle = 15
		%LoftRangeFac = 0.4
		%LoftAltitudeAdvMax = -100000
		%LoftRangeOverride = 16000
		%terminalHomingRange = 5000
	}
}
