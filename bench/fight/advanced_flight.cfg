// Radars that warning receivers hear only from closer in (low probability of intercept): rwrDetectability is the share of the usual
// range. Inside it the receiver still tells a sweep from a lock and warns of the launch.
@PART[AESA]:FINAL
{
	@MODULE[ModuleRadar]
	{
		%rwrDetectability = 0.6
	}
}
