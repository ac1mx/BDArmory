// Heat: flareRejection is how much brighter than the craft a flare has to look, trackGate (deg) how close to the craft it has to be,
// resolveRange (m) where the seeker tells the craft from a point of light and ignores flares.
@PART[AIM9X]:FINAL
{
	@MODULE[MissileLauncher]
	{
		%smartSeeker = true
		%flareRejection = 1.25
		%trackGate = 3
		%resolveRange = 700
	}
}
